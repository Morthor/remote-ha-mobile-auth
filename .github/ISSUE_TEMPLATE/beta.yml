name: Beta test feedback
description: Record a Remote HA Mobile release journey without household secrets.
title: "[Beta]: "
labels:
  - beta-feedback
body:
  - type: markdown
    attributes:
      value: |
        Do not include access tokens, passwords, private URLs, Wi-Fi names, entity IDs, camera images, household addresses, or personal account names. Use the app's privacy-safe diagnostics export and review every attachment before uploading it.
  - type: input
    id: version
    attributes:
      label: App version and build
      placeholder: 0.3.0 (27)
    validations:
      required: true
  - type: dropdown
    id: cohort
    attributes:
      label: Test cohort
      options:
        - Internal owner device
        - Family closed beta
        - Unrelated Home Assistant installation
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and device class
      placeholder: Android 16, modern phone
    validations:
      required: true
  - type: dropdown
    id: permission_level
    attributes:
      label: Home Assistant permission level
      description: Do not include a username, role name, or household details.
      options:
        - Administrator
        - Restricted non-administrator
        - Partial area or entity visibility
        - Unknown or not applicable
    validations:
      required: true
  - type: dropdown
    id: journey
    attributes:
      label: Primary journey tested
      options:
        - Discovery, sign-in, logout, or permission failure
        - Onboarding, editing, favorites, or profiles
        - Daily device controls or unknown/unavailable entity
        - Camera preview or fullscreen playback
        - Offline start, resume, or network route transition
        - Doorbell notification after the app was stopped
        - Export, upgrade, reinstall, import, or fresh login
        - Accessibility, language, theme, or large text
        - Other
    validations:
      required: true
  - type: dropdown
    id: route
    attributes:
      label: Route shown by the app
      options:
        - Local
        - VPN or remote
        - Offline or unknown
    validations:
      required: true
  - type: dropdown
    id: transition
    attributes:
      label: Network or lifecycle transition
      options:
        - None or steady connection
        - Wi-Fi access-point handoff
        - Local to VPN or remote
        - VPN or remote to local
        - Mobile data transition
        - Foreground or background resume
        - Cold or offline start
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps performed
      description: List the tested sequence without naming private devices or entities.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: dropdown
    id: reproducibility
    attributes:
      label: Reproducibility
      options:
        - Passed repeatedly
        - Passed once
        - Failed every time
        - Failed often
        - Failed sometimes
        - Failed once
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Release impact
      options:
        - Blocks promotion due to crash, data loss, unsafe action, security, or accessibility
        - Blocks reliable daily control
        - Major problem with a workaround
        - Minor problem
        - No defect; journey passed
        - Suggestion only
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Privacy-safe diagnostics
      description: Attach or paste the diagnostics exported by the app after reviewing them.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I checked this report and its attachments for household secrets and imagery.
          required: true
