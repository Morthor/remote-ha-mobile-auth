name: Support request
description: Report a reproducible Remote HA Mobile problem without household secrets.
title: "[Support]: "
labels:
  - support
body:
  - type: markdown
    attributes:
      value: |
        Do not include access tokens, passwords, private URLs, Wi-Fi names, entity IDs, camera images, or household addresses. Use the app's privacy-safe diagnostics export and review attachments before uploading them.
  - type: input
    id: version
    attributes:
      label: App version and build
      placeholder: 0.2.2-dev (26)
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and device class
      placeholder: Android 16, modern phone
    validations:
      required: true
  - type: dropdown
    id: route
    attributes:
      label: Route shown by the app
      options:
        - Local
        - VPN
        - Offline or unknown
    validations:
      required: true
  - type: dropdown
    id: permission_level
    attributes:
      label: Home Assistant permission level
      description: Do not include a username, role name, or household details.
      options:
        - Administrator
        - Restricted non-administrator
        - Partial area or entity visibility
        - Unknown or not applicable
    validations:
      required: true
  - type: dropdown
    id: transition
    attributes:
      label: Network or lifecycle transition
      options:
        - None or steady connection
        - Wi-Fi access-point handoff
        - Local to VPN or remote
        - VPN or remote to local
        - Mobile data transition
        - Foreground or background resume
        - Cold or offline start
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest repeatable sequence without naming private devices or entities.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: dropdown
    id: reproducibility
    attributes:
      label: Reproducibility
      options:
        - Every time
        - Often
        - Sometimes
        - Once
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Daily-control impact
      options:
        - Blocks a safe daily control or causes data loss
        - Major problem with a workaround
        - Minor problem
        - Suggestion only
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Privacy-safe diagnostics
      description: Attach or paste the diagnostics exported by the app after reviewing them.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I checked this report and its attachments for household secrets and imagery.
          required: true
